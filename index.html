<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAON SERVER | OPENING SOON</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #ffffff;
      background: #080b16;
    }

    .hero {
      min-height: 100vh;
      padding: 28px 8%;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 15% 20%, rgba(112, 86, 255, .42), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(51, 192, 255, .22), transparent 30%),
        #080b16;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .menu {
      display: flex;
      gap: 22px;
    }

    .menu a {
      color: #c8c9d3;
      text-decoration: none;
      font-size: 14px;
    }

    .main {
      flex: 1;
      max-width: 800px;
      margin: auto 0;
      padding: 90px 0;
    }

    .badge {
      display: inline-block;
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 30px;
      color: #d9ccff;
      font-size: 13px;
      letter-spacing: 1px;
    }

    h1 {
      margin: 22px 0 18px;
      font-size: clamp(42px, 7vw, 86px);
      line-height: 1.08;
      letter-spacing: -3px;
    }

    h1 span {
      color: #ad92ff;
    }

    .text {
      color: #b9bac7;
      font-size: 18px;
      line-height: 1.8;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 34px;
      flex-wrap: wrap;
    }

    .button {
      padding: 15px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      color: #12101c;
      background: #b79cff;
    }

    .secondary {
      color: #ffffff;
      border: 1px solid rgba(255,255,255,.3);
    }

    .status {
      color: #8ee6b8;
      font-size: 14px;
      margin-top: 60px;
    }

    @media (max-width: 600px) {
      .menu { display: none; }
      .hero { padding: 24px; }
    }
  </style>
</head>

<body>
  <section class="hero">
    <nav>
      <div class="logo">RAON SERVER</div>

      <div class="menu">
        <a href="#intro">소개</a>
        <a href="#notice">소식</a>
        <a href="#guide">가이드</a>
      </div>
    </nav>

    <main class="main">
      <div class="badge">OPENING SOON</div>

      <h1>
        새롭게 리뉴얼된<br>
        <span>RAON SERVER</span>
      </h1>

      <p class="text">
        더 단단하게 준비했습니다.<br>
        당신의 선택으로 이야기를 만들어 가는 도시,
        라온의 새로운 시작을 함께해 주세요.
      </p>

      <div class="buttons">
        <a class="button primary" href="#">디스코드 입장하기</a>
        <a class="button secondary" href="#">스태프 지원하기</a>
      </div>
    </main>

    <div class="status">● RAON SERVER · 오픈 준비중</div>
  </section>
</body>
</html>
